[project]
name = "discord-game-presence-manager"
version = "0.1.0"
description = "A Discord Rich Presence manager for games."
requires-python = ">=3.10"
dependencies = [
    "PyQt5",
    "psutil",
    "requests",
    "selenium",
    "pypresence",
    "beautifulsoup4",
    "python-dotenv",
    "pywin32; sys_platform == 'win32'",
    "winshell; sys_platform == 'win32'",
    "browser-cookie3",
    "rapidfuzz",
    "pyqt5-qt5==5.15.2 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff",
    "ty"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.10"
